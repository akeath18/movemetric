<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Practice science teaching in an AI-powered virtual classroom with responsive student characters.">
  <meta name="theme-color" content="#081426">
  <title>Science Teaching Simulator | MoveMetric</title>
  <link rel="preconnect" href="https://practicesphere-science-simulator.akeath.chatgpt.site">
  <style>
    :root {
      color-scheme: dark;
      --ink: #f7fbff;
      --muted: #a9b8cd;
      --navy: #081426;
      --blue: #16a9e0;
      --line: rgba(255, 255, 255, .12);
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--navy);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body { display: grid; grid-template-rows: 64px minmax(0, 1fr); }

    .site-bar {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 16px;
      min-width: 0;
      padding: 0 22px;
      border-bottom: 1px solid var(--line);
      background: rgba(8, 20, 38, .96);
      box-shadow: 0 8px 28px rgba(0, 0, 0, .22);
    }

    .back,
    .launch {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 38px;
      border-radius: 10px;
      text-decoration: none;
      font-size: .82rem;
      font-weight: 750;
      letter-spacing: .01em;
      white-space: nowrap;
    }

    .back {
      gap: 7px;
      padding: 0 12px;
      border: 1px solid var(--line);
      color: var(--muted);
    }

    .back:hover,
    .back:focus-visible { color: var(--ink); border-color: rgba(255, 255, 255, .28); }

    .identity { min-width: 0; }
    .identity strong { display: block; font-size: .93rem; letter-spacing: -.01em; }
    .identity span { display: block; margin-top: 2px; color: var(--muted); font-size: .7rem; }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin-left: auto;
      color: #b9c8d9;
      font-size: .72rem;
      white-space: nowrap;
    }

    .status::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #32d583;
      box-shadow: 0 0 0 4px rgba(50, 213, 131, .12);
    }

    .launch {
      padding: 0 15px;
      background: var(--blue);
      color: #03131f;
    }

    .launch:hover,
    .launch:focus-visible { filter: brightness(1.08); }

    .simulator-frame {
      position: relative;
      min-height: 0;
      background:
        radial-gradient(circle at 50% 30%, rgba(22, 169, 224, .12), transparent 38%),
        var(--navy);
    }

    .loading {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: var(--muted);
      font-size: .85rem;
    }

    iframe {
      position: relative;
      z-index: 1;
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #eef3f7;
    }

    @media (max-width: 720px) {
      body { grid-template-rows: 56px minmax(0, 1fr); }
      .site-bar { padding: 0 10px; gap: 9px; }
      .back { width: 38px; padding: 0; font-size: 0; }
      .back::after { content: "←"; font-size: 1rem; }
      .identity span, .status { display: none; }
      .identity strong { font-size: .82rem; }
      .launch { margin-left: auto; padding: 0 10px; font-size: .74rem; }
    }
  </style>
</head>
<body>
  <header class="site-bar">
    <a class="back" href="index.html" aria-label="Back to MoveMetric">← <span>MoveMetric</span></a>
    <div class="identity">
      <strong>PracticeSphere Science Simulator</strong>
      <span>AI-powered teacher rehearsal environment</span>
    </div>
    <span class="status">Live classroom</span>
    <a class="launch" href="https://practicesphere-science-simulator.akeath.chatgpt.site/" target="_blank" rel="noopener">Open full screen ↗</a>
  </header>

  <main class="simulator-frame">
    <div class="loading" aria-hidden="true">Loading the virtual classroom…</div>
    <iframe
      title="PracticeSphere science teaching simulator"
      src="https://practicesphere-science-simulator.akeath.chatgpt.site/"
      allow="microphone; autoplay"
      allowfullscreen
      referrerpolicy="strict-origin-when-cross-origin"
    ></iframe>
  </main>
</body>
</html>
